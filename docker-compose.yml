services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: probase-api
    restart: unless-stopped
    env_file: .env
    environment:
      # These override .env file internally for docker network
      - DATABASE_URL=postgresql://probase:probase123@postgres:5432/probase?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    container_name: probase-db
    restart: unless-stopped
    ports:
      - "5432:5432" # Keep exposed for local access (DataGrip/DBeaver)
    environment:
      POSTGRES_USER: probase
      POSTGRES_PASSWORD: probase123
      POSTGRES_DB: probase
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: probase-redis
    restart: unless-stopped
    ports:
      - "6379:6379" # Keep exposed for local access (RedisInsight)
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: probase-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
